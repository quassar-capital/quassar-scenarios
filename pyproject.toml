[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quassar-scenarios"
version = "0.1.0"
description = "Macro-financial scenario and cross-asset stress research prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]
license = {text = "Proprietary"}

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
